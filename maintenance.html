<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปิดปรับปรุงชั่วคราว — Flexozy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#050810;
    --bg-mid:#0a1226;
    --ice:#e8effa;
    --sky:#5fb4ff;
    --violet:#7c7bff;
    --line: rgba(232,239,250,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: radial-gradient(120% 90% at 50% -10%, #101d3d 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
    color:var(--ice);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }

  /* faint grid */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(60% 50% at 50% 35%, black 0%, transparent 75%);
    pointer-events:none;
  }

  /* glow orb */
  .glow{
    position:fixed;
    top:-220px;
    left:50%;
    transform:translateX(-50%);
    width:640px;
    height:640px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(95,180,255,0.35) 0%, rgba(124,123,255,0.18) 40%, transparent 72%);
    filter: blur(10px);
    animation: breathe 7s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{ opacity:0.75; transform:translateX(-50%) scale(1); }
    50%{ opacity:1; transform:translateX(-50%) scale(1.06); }
  }

  main{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:rgba(232,239,250,0.65);
    border:1px solid var(--line);
    padding:7px 14px;
    border-radius:999px;
    margin-bottom:36px;
    background:rgba(255,255,255,0.02);
  }
  .badge .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--sky);
    box-shadow:0 0 10px var(--sky);
  }

  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(32px,6vw,52px);
    line-height:1.2;
    margin:0 0 18px;
    max-width:15ch;
    background:linear-gradient(180deg,#ffffff 0%,#c9d9f5 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  p.sub{
    font-size:16px;
    color:rgba(232,239,250,0.6);
    max-width:44ch;
    line-height:1.7;
    margin:0 0 44px;
  }

  .progress{
    width:100%;
    max-width:360px;
    margin-bottom:12px;
  }
  .progress-track{
    height:6px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:64%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--sky), var(--violet));
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:rgba(232,239,250,0.45);
    margin-top:10px;
  }

  footer{
    position:relative;
    z-index:1;
    text-align:center;
    padding:28px 20px 34px;
    font-size:13px;
    color:rgba(232,239,250,0.4);
  }
  footer a{
    color:rgba(232,239,250,0.65);
    text-decoration:none;
    border-bottom:1px solid rgba(232,239,250,0.25);
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <main>
    <div class="badge"><span class="dot"></span> กำลังปรับปรุงระบบอยู่</div>

    <h1>เว็บกำลังพักปรับโครงสร้างใหม่ กลับมาเร็วๆ นี้</h1>
    <p class="sub">ทีมงานกำลังอัปเกรดระบบเบื้องหลังเพื่อให้ใช้งานได้เสถียรและปลอดภัยขึ้น ระหว่างนี้บัญชี สคริปต์ และ Vault ของทุกคนยังอยู่ครบ ไม่มีอะไรหายไป</p>

    <div class="progress">
      <div class="progress-track"><div class="progress-fill"></div></div>
      <div class="progress-label">
        <span>กำลังดำเนินการ</span>
        <span>คาดว่าจะเสร็จภายในไม่กี่ชั่วโมง</span>
      </div>
    </div>
  </main>

  <footer>
    มีคำถามด่วน ทักมาได้ที่ <a href="#">Discord ของทีม</a>
  </footer>
</body>
</html>
